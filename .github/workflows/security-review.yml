name: AI Security Review

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  security-review:
    uses: venessa3105-hash/AI-Vulnerability-Scanner-/.github/workflows/security-review.yml@main
    with:
      repository: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      organization: venessa3105-hash
      scanner_repository: venessa3105-hash/AI-Vulnerability-Scanner-
    secrets:
      TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
